<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUX // OS TERMINAL</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --cyber-dark: #030712;
            --panel-bg: rgba(10, 16, 30, 0.85);
            --border-glow: rgba(0, 242, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--cyber-dark);
            color: var(--neon-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .terminal-container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2), inset 0 0 15px rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Header Bar */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 12px;
        }

        .brand-title {
            font-size: 1.4rem;
            letter-spacing: 4px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .sys-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        /* Main Grid Area */
        .hud-grid {
            display: grid;
            grid-template-columns: 260px 1fr 340px;
            gap: 15px;
            min-height: 420px;
        }

        .hud-card {
            background: rgba(5, 10, 20, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            font-size: 0.75rem;
            color: #8ab4f8;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-glow);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        /* Left Diagnostics */
        .diag-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .diag-val {
            color: #fff;
            font-weight: bold;
        }

        /* Center Holographic Blob */
        .core-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: relative;
        }

        #holoCanvas {
            width: 100%;
            height: 280px;
        }

        /* Upper Right Chat Log */
        .chat-log {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            padding-right: 5px;
        }

        .log-entry {
            font-size: 0.85rem;
            line-height: 1.4;
            padding: 8px 10px;
            border-radius: 4px;
        }

        .log-entry.user {
            background: rgba(0, 242, 255, 0.08);
            border-left: 2px solid var(--neon-blue);
            color: #fff;
        }

        .log-entry.ai {
            background: rgba(255, 0, 127, 0.08);
            border-left: 2px solid var(--neon-pink);
            color: #ff80bf;
        }

        .entry-author {
            font-size: 0.65rem;
            opacity: 0.7;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        /* Bottom Command Input */
        .terminal-bar {
            display: flex;
            gap: 10px;
            background: rgba(5, 10, 20, 0.8);
            border: 1px solid var(--neon-blue);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            padding: 8px;
        }

        .cmd-input::placeholder {
            color: rgba(0, 242, 255, 0.4);
        }

        .hud-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .hud-btn:hover {
            background: rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .hud-btn.active {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        /* Mobile Adaptation */
        @media (max-width: 900px) {
            .hud-grid {
                grid-template-columns: 1fr;
            }
            .terminal-container {
                padding: 12px;
            }
            .terminal-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <!-- Header -->
    <div class="hud-header">
        <div class="brand-title">FLUX // SYSTEM CORE</div>
        <div id="sysStatus" class="sys-badge">SYSTEM READY</div>
    </div>

    <!-- HUD Main Layout Grid -->
    <div class="hud-grid">
        <!-- Left: Telemetry & Status -->
        <div class="hud-card">
            <div class="card-header">System Diagnostics</div>
            <div class="diag-row"><span>CORE MODEL:</span> <span class="diag-val">QWEN-27B</span></div>
            <div class="diag-row"><span>VOICE LOCALE:</span> <span class="diag-val">DEFAULT SYS</span></div>
            <div class="diag-row"><span>AUDIO MATRIX:</span> <span class="diag-val">ACTIVE</span></div>
            <div class="diag-row"><span>PROCESSING:</span> <span class="diag-val">OPTIMAL</span></div>
            <div class="card-header" style="margin-top: 15px;">Protocols</div>
            <div class="diag-row"><span>HUD TELEMETRY:</span> <span class="diag-val">ONLINE</span></div>
            <div class="diag-row"><span>SEC_LEVEL:</span> <span class="diag-val">ALPHA</span></div>
        </div>

        <!-- Center: Holographic Blob Visualizer -->
        <div class="hud-card core-container">
            <div class="card-header" style="position: absolute; top: 15px; left: 15px; width: calc(100% - 30px);">A.I. Core Matrix</div>
            <canvas id="holoCanvas"></canvas>
        </div>

        <!-- Upper Right: Live Text Terminal Log -->
        <div class="hud-card">
            <div class="card-header">Text Terminal Log</div>
            <div id="chatLog" class="chat-log">
                <div class="log-entry ai">
                    <div class="entry-author">FLUX // A.I.</div>
                    Online and standing by. Speak or transmit your query.
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom: Command Entry Panel -->
    <div class="terminal-bar">
        <input type="text" id="cmdInput" class="cmd-input" placeholder="Type command query here...">
        <button id="sendBtn" class="hud-btn">TRANSMIT</button>
        <button id="micBtn" class="hud-btn">🎤 VOICE INPUT</button>
    </div>
</div>

<script>
    // --- CONFIGURATION & STATE ---
    const GROQ_API_KEY = "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"; 
    
    const systemPrompt = {
        "role": "system", 
        "content": "You are Flux, a witty, polite, and concise AI assistant. Keep responses short and conversational, as they will be spoken out loud. Avoid markdown formatting symbols."
    };
    
    let conversationHistory = [systemPrompt];
    let isSpeaking = false;
    let isListening = false;

    // UI Elements
    const sysStatus = document.getElementById("sysStatus");
    const chatLog = document.getElementById("chatLog");
    const cmdInput = document.getElementById("cmdInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    function setStatus(text, color = "#00f2ff") {
        sysStatus.innerText = text;
        sysStatus.style.borderColor = color;
        sysStatus.style.color = color;
    }

    function addLogEntry(author, text, isUser = false) {
        const entry = document.createElement("div");
        entry.className = `log-entry ${isUser ? 'user' : 'ai'}`;
        entry.innerHTML = `<div class="entry-author">${author}</div>${text}`;
        chatLog.appendChild(entry);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    // --- HOLOGRAPHIC ORB CANVAS ANIMATION ---
    const canvas = document.getElementById("holoCanvas");
    const ctx = canvas.getContext("2d");

    function fitCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 280;
    }
    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    let step = 0;
    function renderCore() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const baseRadius = 60;

        step += 0.04;
        const pulse = Math.sin(step) * 10;
        const currentRadius = baseRadius + (isSpeaking ? pulse * 1.5 : (isListening ? pulse : pulse * 0.4));

        // Core Glowing Orb Gradient
        const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, currentRadius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, isSpeaking ? '#ff007f' : '#00f2ff');
        grad.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(cx, cy, currentRadius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Orbital Ring
        ctx.strokeStyle = isSpeaking ? '#ff007f' : '#00f2ff';
        ctx.lineWidth = 1.5;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(step * 0.5);
        ctx.beginPath();
        ctx.arc(0, 0, baseRadius + 25, 0, Math.PI * 1.5);
        ctx.stroke();
        ctx.restore();

        requestAnimationFrame(renderCore);
    }
    renderCore();

    // --- SPEECH RECOGNITION (STT) - MANUAL TOGGLE ONLY ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        micBtn.addEventListener("click", () => {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }
            if (!isListening) {
                try { recognition.start(); } catch (e) { console.warn(e); }
            } else {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add("active");
            micBtn.innerText = "🛑 LISTENING...";
            setStatus("LISTENING...", "#ff007f");
        };

        recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript.trim();
            processQuery(speechResult);
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove("active");
            micBtn.innerText = "🎤 VOICE INPUT";
            if (!isSpeaking) setStatus("SYSTEM READY", "#00f2ff");
        };

        recognition.onerror = () => {
            isListening = false;
            micBtn.classList.remove("active");
            micBtn.innerText = "🎤 VOICE INPUT";
            if (!isSpeaking) setStatus("SYSTEM READY", "#00f2ff");
        };
    } else {
        micBtn.style.display = 'none';
    }

    // --- QUERY SUBMISSION PIPELINE ---
    async function processQuery(queryText) {
        if (!queryText.trim()) return;

        addLogEntry("USER", queryText, true);
        cmdInput.value = "";
        setStatus("PROCESSING...", "#8ab4f8");

        if (isListening && recognition) {
            try { recognition.stop(); } catch(e){}
        }

        conversationHistory.push({ role: "user", content: queryText });

        const reply = await queryGroqAPI(conversationHistory);
        const cleanReply = reply.replace(/[*_#`~]/g, '').replace(/\[.*?\]/g, '').trim();

        addLogEntry("FLUX", reply, false);
        conversationHistory.push({ role: "assistant", content: reply });

        speakText(cleanReply);
    }

    sendBtn.addEventListener("click", () => processQuery(cmdInput.value));
    cmdInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") processQuery(cmdInput.value);
    });

    // --- GROQ API INTEGRATION ---
    async function queryGroqAPI(history) {
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "qwen/qwen3.8-27b",
                    messages: history,
                    temperature: 0.7,
                    max_completion_tokens: 150
                })
            });

            const data = await response.json();
            if (data.error) {
                return `API Error: ${data.error.message || 'Check configuration.'}`;
            }
            return data.choices[0].message.content;
        } catch (error) {
            console.error("Groq API Error:", error);
            return "Systems experiencing minor glitch, sir.";
        }
    }

    // --- DEFAULT SYSTEM TEXT-TO-SPEECH (TTS) PIPELINE ---
    function speakText(text) {
        if (!('speechSynthesis' in window)) {
            setStatus("SYSTEM READY", "#00f2ff");
            return;
        }

        isSpeaking = true;
        setStatus("SPEAKING...", "#ff007f");
        window.speechSynthesis.cancel(); // Clear stuck speech queues

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.95;
        utterance.lang = 'en-US'; // Uses browser default system voice directly

        // Safety failsafe timer to prevent permanent SPEAKING lock
        const speechTimeout = setTimeout(() => {
            if (isSpeaking) {
                isSpeaking = false;
                setStatus("SYSTEM READY", "#00f2ff");
            }
        }, Math.max(4000, text.length * 80));

        utterance.onend = () => {
            clearTimeout(speechTimeout);
            isSpeaking = false;
            setStatus("SYSTEM READY", "#00f2ff");
        };

        utterance.onerror = () => {
            clearTimeout(speechTimeout);
            isSpeaking = false;
            setStatus("SYSTEM READY", "#00f2ff");
        };

        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
