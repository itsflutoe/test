<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>FLUX // MEDIA COMMAND TERMINAL</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(10, 16, 30, 0.85);
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --text-color: #c0e0ff;
            --border-glow: rgba(0, 242, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Monaco, 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            position: relative;
        }

        .terminal-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--border-glow);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .terminal-header {
            background: rgba(0, 242, 255, 0.1);
            padding: 12px 20px;
            border-bottom: 1px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-title {
            color: var(--neon-blue);
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0, 242, 255, 0.15);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
        }

        .terminal-logs {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            font-size: 0.9rem;
            line-height: 1.4;
            animation: fadeIn 0.2s ease-in;
        }

        .log-prefix {
            color: var(--neon-pink);
            font-weight: bold;
            margin-right: 8px;
        }

        .log-user {
            color: #fff;
        }

        .terminal-input-container {
            padding: 15px 20px;
            border-top: 1px solid var(--border-glow);
            background: rgba(5, 8, 17, 0.9);
            display: flex;
            gap: 10px;
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 10px 14px;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .cmd-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px var(--border-glow);
        }

        .btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
        }

        .presets {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px dashed rgba(0, 242, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            flex-wrap: wrap;
        }

        .preset-btn {
            font-size: 0.75rem;
            padding: 4px 8px;
            border: 1px solid rgba(0, 242, 255, 0.4);
            border-radius: 3px;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
        }

        .preset-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* FLOATING VIDEO PLAYER DOCK */
        .video-dock {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 340px;
            background: rgba(5, 8, 17, 0.95);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            z-index: 1000;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease-out;
        }

        .dock-header {
            background: rgba(0, 242, 255, 0.15);
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            font-size: 0.75rem;
            color: var(--neon-blue);
            font-weight: bold;
        }

        .dock-controls {
            display: flex;
            gap: 6px;
        }

        .dock-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .dock-btn:hover {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            color: #fff;
        }

        .dock-body {
            width: 100%;
            height: 195px;
            background: #000;
            transition: height 0.2s ease;
        }

        .dock-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .minimized .dock-body {
            height: 0px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">
        <div class="terminal-title">FLUX // MEDIA COMMAND TERMINAL</div>
        <div class="status-badge" id="statusBadge">READY</div>
    </div>

    <div class="terminal-logs" id="logContainer">
        <div class="log-entry">
            <span class="log-prefix">FLUX:</span> Media streamer online. Type <code style="color:var(--neon-blue)">/play [track title]</code> or tap a preset to launch video playback in the floating dock.
        </div>
    </div>

    <div class="presets">
        <span style="font-size: 0.75rem; color: #888; align-self: center;">QUICK FREQUENCIES:</span>
        <button class="preset-btn" onclick="executeCommand('/play Balisong Rico Blanco')">/play Balisong Rico Blanco</button>
        <button class="preset-btn" onclick="executeCommand('/play Daylight Taylor Swift')">/play Daylight Taylor Swift</button>
        <button class="preset-btn" onclick="executeCommand('/play Slide Away Oasis')">/play Slide Away Oasis</button>
    </div>

    <div class="terminal-input-container">
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Type /play [song name] or prompt FLUX..." onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="submitCommand()">EXECUTE</button>
    </div>
</div>

<!-- FLOATING VIDEO PLAYER DOCK -->
<div class="video-dock" id="videoDock">
    <div class="dock-header">
        <span id="dockTitle">▶ MEDIA STREAM</span>
        <div class="dock-controls">
            <button class="dock-btn" onclick="toggleMinimize()" id="minBtn">[-]</button>
            <button class="dock-btn" onclick="closeVideoPlayer()" style="border-color:#ff007f; color:#ff007f;">[X]</button>
        </div>
    </div>
    <div class="dock-body" id="dockBody">
        <iframe id="videoIframe" src="" title="FLUX Player" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</div>

<script>
// --- DIRECT TRACK ID MAP (BYPASSES EMBED RESTRICTIONS) ---
const trackMap = {
    "balisong rico blanco": "y84LzE309p8",
    "balisong": "y84LzE309p8",
    "daylight taylor swift": "u9raS7-Lz2s",
    "daylight": "u9raS7-Lz2s",
    "slide away oasis": "1E1v6bWjZps",
    "slide away": "1E1v6bWjZps"
};

// --- SPEECH SYNTHESIS ENGINE ---
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
}

// --- LOGGING & STATUS ---
function addLogEntry(sender, text, isUser = false) {
    const logContainer = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    
    if (isUser) {
        entry.innerHTML = `<span class="log-prefix" style="color:#fff;">USER:</span> <span class="log-user">${text}</span>`;
    } else {
        entry.innerHTML = `<span class="log-prefix">${sender}:</span> ${text}`;
    }
    
    logContainer.appendChild(entry);
    logContainer.scrollTop = logContainer.scrollHeight;
}

function setStatus(text, color = "#00f2ff") {
    const badge = document.getElementById('statusBadge');
    badge.innerText = text;
    badge.style.borderColor = color;
    badge.style.color = color;
}

// --- FLOATING MEDIA PLAYER CONTROLS ---
function playMusicTrack(songQuery) {
    const cleanQuery = songQuery.trim();
    const queryKey = cleanQuery.toLowerCase();
    
    addLogEntry("FLUX", `Targeting video stream for: "${cleanQuery}"...`, false);
    setStatus("STREAMING VIDEO", "#ff007f");

    const dock = document.getElementById('videoDock');
    const iframe = document.getElementById('videoIframe');
    const dockTitle = document.getElementById('dockTitle');

    dockTitle.innerText = `▶ ${cleanQuery.toUpperCase()}`;

    // If query matches a mapped key, load direct unblocked ID. Otherwise, use YouTube Search Embed.
    let targetSrc = "";
    if (trackMap[queryKey]) {
        targetSrc = `https://www.youtube-nocookie.com/embed/${trackMap[queryKey]}?autoplay=1&enablejsapi=1`;
    } else {
        targetSrc = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(cleanQuery)}&autoplay=1&enablejsapi=1`;
    }

    iframe.src = targetSrc;
    dock.style.display = 'flex';
    dock.classList.remove('minimized');
    document.getElementById('minBtn').innerText = '[-]';

    addLogEntry("FLUX", `Media dock active. Click <b>[X]</b> to close stream.`, false);
    speakText(`Streaming ${cleanQuery} in media dock, sir.`);
}

function closeVideoPlayer() {
    const dock = document.getElementById('videoDock');
    const iframe = document.getElementById('videoIframe');
    
    iframe.src = '';
    dock.style.display = 'none';

    addLogEntry("FLUX", "Media dock terminated by user.", false);
    speakText("Playback terminated, sir.");
    setStatus("READY", "#00f2ff");
}

function toggleMinimize() {
    const dock = document.getElementById('videoDock');
    const minBtn = document.getElementById('minBtn');
    
    dock.classList.toggle('minimized');
    if (dock.classList.contains('minimized')) {
        minBtn.innerText = '[+]';
    } else {
        minBtn.innerText = '[-]';
    }
}

// --- COMMAND ROUTER ---
function processQuery(queryText) {
    const trimmed = queryText.trim();
    if (!trimmed) return;

    addLogEntry("USER", trimmed, true);

    if (trimmed.startsWith('/play') || trimmed.startsWith('/music')) {
        const songQuery = trimmed.replace(/^\/(play|music)/i, '').trim();
        if (songQuery) {
            playMusicTrack(songQuery);
        } else {
            addLogEntry("FLUX", "Error: Specify a track name. Usage: /play [song name]", false);
            speakText("Please specify a track title, sir.");
        }
        return;
    }

    if (trimmed.toLowerCase().startsWith('play ')) {
        const songQuery = trimmed.slice(5).trim();
        if (songQuery) {
            playMusicTrack(songQuery);
            return;
        }
    }

    addLogEntry("FLUX", `Command [${trimmed}] executed.`, false);
}

function submitCommand() {
    const input = document.getElementById('cmdInput');
    const val = input.value;
    input.value = '';
    processQuery(val);
}

function executeCommand(cmd) {
    document.getElementById('cmdInput').value = cmd;
    submitCommand();
}

function handleKeyPress(e) {
    if (e.key === 'Enter') {
        submitCommand();
    }
}
</script>

</body>
</html>
